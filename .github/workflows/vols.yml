# Vols en direct : toutes les 10 minutes, récupère les départs / arrivées du jour de marseille.aeroport.fr
# (outils/vols_mrs.py) et publie data/vols.json avec l'app si quelque chose a changé.
name: Vols en direct
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: vols
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les vols
        run: python3 outils/vols_mrs.py
      - name: Publier si changé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vols.json
          git diff --cached --quiet && { echo "Aucun changement"; exit 0; }
          git commit -q -m "Vols en direct $(TZ=Europe/Paris date +%H:%M)"
          git pull -q --rebase && git push -q
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
